<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device=width, initial-scale=1.0">
    <title>IMC Abaixo do Peso</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="abaixo">
    <main class="resultado">
        <h1>Resultado IMC</h1>
        
        <h2>{nome}</h2>

        <p>Peso: <strong>{peso} Kg</strong></p>
        <p>Altura: <strong>{altura} cm</strong></p>
        <p>IMC: <strong>{imc}</strong></p>

        <h2>Classificacao: {classificacao}</h2>

        <a href="/">Voltar</a>
    </main>
</body>
</html>
